<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Property Console · Caribbean Paradise Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#2b2723; --soft:#6e6862; --faint:#a09a8f; --line:#e7e1d8; --bg:#f3efe9;
         --card:#fff; --green:#4a5a3c; --greenbg:#edf0e7; --red:#a8543a; --redbg:#f6e9e3;
         --amber:#8a6a1f; --amberbg:#f5efdf; --blue:#2f4a5a; --bluebg:#e9eef2;
         --sidebar:#211e1a; --sidetext:#cfc9bf; --btn:#2f7d4f; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  h1,h2,.serif{ font-family:Newsreader,Georgia,serif; font-weight:400; }
  a{ color:var(--green); text-decoration:none; }

  /* login */
  .loginScreen{ display:none; position:fixed; inset:0; background:#1c3550; align-items:flex-start; justify-content:center; padding:9vh 20px; z-index:100; }
  body.login-mode .loginScreen{ display:flex; } body.login-mode .shell{ display:none; }
  .loginBox{ width:100%; max-width:400px; background:#ecece6; border-radius:16px; padding:30px 28px; box-shadow:0 24px 60px rgba(0,0,0,.4); text-align:center; }
  .loginBox img{ width:60px; height:auto; margin:0 auto 12px; display:block; }
  .loginBox .lbrand{ letter-spacing:.2em; font-size:12px; color:#6e6862; text-transform:uppercase; }
  .loginBox h2{ font-size:26px; font-weight:700; margin:6px 0 2px; color:#22201c; }
  .loginBox .lsub{ color:#6e6862; font-size:14px; margin-bottom:16px; }
  .loginBox .lfield{ text-align:left; margin-top:12px; }
  .loginBox .signin{ width:100%; background:var(--btn); color:#fff; border:0; border-radius:10px; padding:13px; font-size:15px; margin-top:16px; cursor:pointer; }
  .loginBox .lfoot{ color:#8a8378; font-size:12px; margin-top:14px; }

  /* shell */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{ width:250px; flex:0 0 250px; background:var(--sidebar); color:var(--sidetext); padding:22px 16px; display:flex; flex-direction:column; }
  .sidebar .brand{ display:flex; align-items:center; gap:12px; padding:0 6px 8px; }
  .sidebar .brand img{ width:42px; height:auto; }
  .sidebar .brand .bt{ font-family:Newsreader,Georgia,serif; font-size:18px; color:#fff; line-height:1.1; }
  .sidebar .brand .bs{ font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:#8f887d; margin-top:2px; }
  .nav{ margin-top:18px; display:flex; flex-direction:column; gap:2px; }
  .nav > button{ text-align:left; background:none; border:0; color:var(--sidetext); font:inherit; font-size:15px; padding:10px 12px; border-radius:9px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .nav > button:hover{ background:rgba(255,255,255,.06); }
  .nav > button[aria-current="true"]{ background:#f3efe9; color:#211e1a; }
  .nav > button .badge{ font-size:11px; background:rgba(255,255,255,.14); color:#e9e4da; border-radius:20px; padding:1px 8px; }
  .nav > button[aria-current="true"] .badge{ background:#e0dccf; color:#5a544a; }
  .navgroup{ font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:#8b857a; padding:12px 12px 6px; }
  .submenu{ display:none; flex-direction:column; gap:1px; margin:0 0 8px 8px; padding-left:10px; border-left:1px solid rgba(255,255,255,.1); }
  .submenu.open{ display:flex; }
  .submenu button{ text-align:left; background:none; border:0; color:#a8a196; font:inherit; font-size:14px; padding:8px 11px; border-radius:8px; cursor:pointer; }
  .submenu button:hover{ background:rgba(255,255,255,.06); color:#e3ded4; }
  .submenu button[aria-current="true"]{ background:rgba(255,255,255,.10); color:#fff; font-weight:500; }
  .quickadd{ margin:14px 0 4px; background:var(--btn); color:#fff; border:0; border-radius:10px; padding:11px 14px; font:inherit; font-size:14px; cursor:pointer; }
  .quickadd:hover{ filter:brightness(1.08); }
  /* quick-add modal */
  .modalWrap{ display:none; position:fixed; inset:0; background:rgba(20,18,15,.55); z-index:200; align-items:flex-start; justify-content:center; padding:7vh 20px; overflow:auto; }
  .modalWrap.open{ display:flex; }
  .modalBox{ width:100%; max-width:560px; background:var(--card); border-radius:16px; padding:24px; box-shadow:0 24px 60px rgba(0,0,0,.35); }
  .modalBox h2{ margin:0 0 4px; font-size:22px; }
  .modalHead{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .xbtn{ background:none; border:0; font-size:22px; color:var(--faint); cursor:pointer; line-height:1; padding:0 4px; }
  .qpick{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:16px; }
  .qpick button{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 14px; text-align:left; font:inherit; cursor:pointer; }
  .qpick button:hover{ border-color:#c9c0b0; background:#faf7f2; }
  .qpick .qt{ font-size:15px; font-weight:600; } .qpick .qd{ font-size:12.5px; color:var(--soft); margin-top:3px; }
  .sidefoot{ margin-top:auto; padding-top:16px; font-size:13px; color:#8f887d; }
  .sidefoot button{ background:none; border:1px solid rgba(255,255,255,.16); color:#cfc9bf; border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; margin-top:8px; }

  .main{ flex:1; padding:30px 34px 70px; max-width:1050px; }
  .main.full{ max-width:none; padding:0; }
  .head{ margin-bottom:6px; }
  .eyebrow{ letter-spacing:.14em; text-transform:uppercase; font-size:12px; color:var(--soft); }
  h1{ font-size:30px; margin:4px 0 2px; }
  .sub{ color:var(--soft); font-size:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-top:18px;
         box-shadow:0 1px 2px rgba(33,30,26,.04), 0 6px 18px rgba(33,30,26,.045); }
  /* per-section accent tint (HINT-style): a soft colour band above the first card */
  .main[data-sec] .head{ position:relative; padding-left:16px; }
  .main[data-sec] .head:before{ content:""; position:absolute; left:0; top:4px; bottom:4px; width:4px; border-radius:4px; background:var(--accent,#4a5a3c); }
  .main[data-sec="readings"]{ --accent:#2f4a5a; --tint:#e9eef2; }
  .main[data-sec="workorders"]{ --accent:#8a6a1f; --tint:#f5efdf; }
  .main[data-sec="invoices"]{ --accent:#4a5a3c; --tint:#edf0e7; }
  .main[data-sec="manage"]{ --accent:#6e6862; --tint:#f1ede6; }
  .main[data-sec="villa"]{ --accent:#2f7d4f; --tint:#e8f1ea; }
  .main[data-sec] .eyebrow{ color:var(--accent,#6e6862); }
  .main[data-sec] .stat{ background:linear-gradient(180deg,var(--tint,#fff) 0%,#fff 58%); }
  label{ display:block; font-size:12px; color:var(--soft); text-transform:uppercase; letter-spacing:.06em; margin:0 0 6px; }
  input,select,textarea{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:15px; background:#fff; color:var(--ink); font-family:inherit; }
  textarea{ resize:vertical; min-height:44px; }
  .row{ display:flex; gap:14px; flex-wrap:wrap; } .row>div{ flex:1; min-width:150px; }
  button.primary{ background:var(--ink); color:#fff; border:0; border-radius:10px; padding:12px 18px; font-size:15px; cursor:pointer; font-family:inherit; }
  button.ghost{ background:transparent; color:var(--soft); border:1px solid var(--line); padding:7px 12px; font-size:13px; border-radius:8px; cursor:pointer; }
  button.link{ background:none; border:0; color:var(--red); padding:4px; font-size:13px; cursor:pointer; }
  button:disabled{ opacity:.5; cursor:default; }
  .msg{ margin-top:12px; font-size:14px; } .msg.ok{ color:var(--green); } .msg.err{ color:var(--red); }
  table{ width:100%; border-collapse:collapse; margin-top:6px; font-size:14px; }
  th{ text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--line); padding:8px; font-weight:400; }
  td{ padding:11px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .pill{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--greenbg); color:var(--green); }
  .pill.off{ background:#eee7dd; color:#8a8378; }
  .muted{ color:var(--faint); font-size:12px; margin-top:2px; }
  .empty{ color:var(--faint); padding:16px 8px; }
  code.tag{ background:var(--greenbg); color:#3a6b2c; padding:2px 8px; border-radius:6px; font-size:13px; }
  .stats{ display:flex; gap:14px; flex-wrap:wrap; }
  .stat{ flex:1; min-width:150px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px;
         box-shadow:0 1px 2px rgba(33,30,26,.04), 0 6px 18px rgba(33,30,26,.045); }
  .stat .k{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--soft); }
  .stat .v{ font-family:Newsreader,Georgia,serif; font-size:30px; margin-top:4px; }
  .hidden{ display:none; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 2px; }
  .chip{ background:#fff; border:1px solid var(--line); color:var(--soft); border-radius:20px; padding:7px 15px; font-size:13.5px; cursor:pointer; }
  .chip[aria-pressed="true"]{ background:#211e1a; color:#fff; border-color:#211e1a; }
  .wocard{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:17px 19px; margin-top:12px;
           box-shadow:0 1px 2px rgba(33,30,26,.04), 0 6px 18px rgba(33,30,26,.045); transition:box-shadow .15s, border-color .15s, transform .15s; }
  .wocard[data-open]:hover{ box-shadow:0 2px 4px rgba(33,30,26,.06), 0 10px 26px rgba(33,30,26,.08); transform:translateY(-1px); }
  .wocard .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .wocard h3{ margin:0; font-family:inherit; font-size:16px; font-weight:600; }
  .badges{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .badge2{ background:#f4f0e8; color:#6e6862; border-radius:8px; padding:3px 10px; font-size:12.5px; }
  .stpill{ font-size:12px; padding:4px 11px; border-radius:20px; white-space:nowrap; }
  .wocard .foot{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:12px; flex-wrap:wrap; }
  .wocard[data-open]{ cursor:pointer; } .wocard[data-open]:hover{ border-color:#d9d1c4; }
  .dgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
  .btn-complete{ width:100%; background:#2f7d4f; color:#fff; border:0; border-radius:12px; padding:14px; font-size:16px; cursor:pointer; margin-top:16px; }
  .btn-complete.done{ background:#eee7dd; color:#8a8378; }
  .backlink{ background:none; border:0; color:var(--soft); font:inherit; font-size:14px; cursor:pointer; padding:0; }
  @media (max-width:760px){ .shell{ flex-direction:column; } .sidebar{ width:auto; flex:none; flex-direction:row; flex-wrap:wrap; align-items:center; } .nav{ flex-direction:row; flex-wrap:wrap; margin-top:10px; } .sidefoot{ margin:0 0 0 auto; } .main{ padding:20px; } }
</style>
</head>
<body class="login-mode">

<!-- LOGIN -->
<div class="loginScreen">
  <div class="loginBox">
    <img src="/cph-logo.png" alt="Caribbean Paradise Homes" />
    <div class="lbrand">Caribbean Paradise Homes</div>
    <h2>Property Console</h2>
    <div class="lsub">Staff sign-in</div>
    <div class="lfield"><label>Name</label>
      <select id="loginName"><option value="">Choose…</option><option value="ivonna">Ivonna</option><option value="jan">Jan</option><option value="maria">Maria</option></select>
    </div>
    <div class="lfield"><label>Access code</label>
      <input id="loginCode" type="password" autocomplete="off" placeholder="••••••" />
    </div>
    <button class="signin" id="loginBtn">Sign in</button>
    <div id="loginMsg" class="msg"></div>
    <div class="lfoot">Authorized staff only.</div>
  </div>
</div>

<!-- SHELL -->
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="/cph-logo.png" alt="CPH" />
      <div><div class="bt">Property Console</div><div class="bs">Caribbean Paradise Homes</div></div>
    </div>
    <button class="quickadd" id="quickAddBtn">+ Quick add</button>
    <nav class="nav" id="nav">
      <div class="navgroup">Dashboard</div>
      <div class="submenu open" id="dashSub">
        <button data-dash="overview" aria-current="true">Overview</button>
        <button data-dash="utilities">Utilities</button>
        <button data-dash="labour">Labour &amp; hours</button>
        <button data-dash="maintenance">Maintenance</button>
        <button data-dash="quotes">Quotes</button>
        <button data-dash="payments">Payments</button>
        <button data-dash="statement">Owner statement</button>
        <button data-dash="field">Field app</button>
      </div>
      <div class="navgroup">Operations</div>
      <button data-view="readings">Meter readings</button>
      <button data-view="workorders">Work orders <span class="badge" id="woBadge"></span></button>
      <button data-view="invoices">Invoices <span class="badge" id="invBadge"></span></button>
      <button data-view="manage" id="navManage">Manage</button>
    </nav>
    <div class="sidefoot">
      <div id="whoName"></div>
      <button id="logout" style="margin-top:8px;">Log out</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<!-- QUICK ADD -->
<div class="modalWrap" id="qaWrap">
  <div class="modalBox">
    <div class="modalHead"><div><h2 id="qaTitle">Quick add</h2><div class="sub" id="qaSub">What do you want to add?</div></div><button class="xbtn" id="qaClose">×</button></div>
    <div id="qaBody"></div>
  </div>
</div>

<div id="cphUpdateBar" style="display:none;position:fixed;left:0;right:0;bottom:0;background:#211e1a;color:#fff;padding:12px 16px;text-align:center;font-size:14px;z-index:9999;box-shadow:0 -2px 12px rgba(0,0,0,.15)">A new version of the console is available.<button onclick="location.reload(true)" style="margin-left:12px;background:#2f7d4f;color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px;">Reload</button></div>

<script>
var $ = function(id){ return document.getElementById(id); };
var ME = null, VILLAS = [], STATUSES = [], VIEW = 'dashboard', WO_FILTER = 'open', DASH_SECTION = 'overview';
function stStyle(s){ var m={'Open':['#eee7dd','#8a8378'],'Quoting':['#f5efdf','#8a6a1f'],'Approved':['#edf0e7','#4a5a3c'],'Parts ordered':['#e9eef2','#2f4a5a'],'Scheduled':['#e9eef2','#2f4a5a'],'Done':['#edf0e7','#4a5a3c']}; var c=m[s]||['#eee7dd','#8a8378']; return 'background:'+c[0]+';color:'+c[1]; }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function nfmt(n){ return n==null ? '—' : Number(n).toLocaleString('en-US'); }
function rd(n){ return n==null ? '—' : 'RD$'+Number(n).toLocaleString('en-US'); }
function when(iso){ try{ return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
async function api(p,o){ var r=await fetch(p,Object.assign({headers:{'Content-Type':'application/json'}},o||{})); var b={}; try{b=await r.json();}catch(e){} return {status:r.status,body:b}; }
function fillSelect(sel,arr,ph){ sel.innerHTML=''; if(ph){var o0=document.createElement('option');o0.value='';o0.textContent=ph;sel.appendChild(o0);} arr.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);}); }
/* month-over-month deltas */
function monthKey(iso){ var d=new Date(iso); return isNaN(d)?null:(d.getFullYear()*12+d.getMonth()); }
function monthDelta(items,field){ var now=new Date(); var cm=now.getFullYear()*12+now.getMonth(); var c=0,p=0; (items||[]).forEach(function(x){ var k=monthKey(x[field]); if(k===cm)c++; else if(k===cm-1)p++; }); return {now:c,prev:p,delta:c-p}; }
function deltaHtml(d){ if(!d) return ''; if(d.delta>0) return '<span style="color:#4a5a3c;font-size:12.5px">▲ '+d.delta+' vs last month</span>'; if(d.delta<0) return '<span style="color:#a8543a;font-size:12.5px">▼ '+Math.abs(d.delta)+' vs last month</span>'; return '<span style="color:#a09a8f;font-size:12.5px">'+(d.now?'no change vs last month':'—')+'</span>'; }
function deltaInline(d){ if(!d) return ''; if(d.delta>0) return ' · <span style="color:#4a5a3c">▲ '+d.delta+' this month</span>'; if(d.delta<0) return ' · <span style="color:#a8543a">▼ '+Math.abs(d.delta)+' vs last month</span>'; return ''; }

/* ---- boot / auth ---- */
async function boot(){
  var me = await api('/api/me');
  if(me.status !== 200){ document.body.classList.add('login-mode'); return; }
  ME = me.body; VILLAS = me.body.villas || []; STATUSES = me.body.wo_statuses || [];
  document.body.classList.remove('login-mode');
  $('whoName').textContent = 'Signed in as ' + cap(ME.user);
  $('navManage').style.display = ME.isAdmin ? '' : 'none';
  updateBadges();
  go(VIEW);
}
async function updateBadges(){
  try{ var w = await api('/api/workorders'); var open=(w.body.workorders||[]).filter(function(x){return x.status!=='Done';}).length; $('woBadge').textContent = open || ''; }catch(e){}
  try{ var i = await api('/api/invoices'); var un=(i.body.invoices||[]).filter(function(x){return x.status!=='Paid';}).length; $('invBadge').textContent = un || ''; }catch(e){}
}

/* ---- nav ---- */
document.addEventListener('mousedown', function(e){
  var t=e.target;
  var db=t.closest && t.closest('#dashSub button[data-dash]'); if(db){ e.preventDefault(); openDash(db.getAttribute('data-dash')); return; }
  var nb=t.closest && t.closest('.nav > button[data-view]'); if(nb){ e.preventDefault(); go(nb.getAttribute('data-view')); return; }
}, true);
/* villa clicked inside the dashboard iframe → open its profile */
window.addEventListener('message', function(e){
  var d=e.data; if(d && d.type==='cph-open-villa' && d.villa){ viewVillaProfile(String(d.villa)); }
});
function openDash(section){
  var changedView = (VIEW!=='dashboard');
  DASH_SECTION=section;
  var sub=$('dashSub'); if(sub){ [].forEach.call(sub.children,function(x){ x.setAttribute('aria-current', x.getAttribute('data-dash')===section?'true':'false'); }); }
  if(changedView){ go('dashboard'); return; }   // fresh iframe already opens on #section
  var ifr=$('dashFrame');
  if(!ifr){ go('dashboard'); return; }
  try{
    // set the hash AND re-trigger, so repeat clicks on the same section still work
    ifr.contentWindow.location.hash=section;
    if(ifr.contentWindow.dispatchEvent) ifr.contentWindow.dispatchEvent(new ifr.contentWindow.Event('hashchange'));
  }catch(e){ ifr.src='/property-console#'+section; }
}
function resizeImage(file, cb){ var img=new Image(), url=URL.createObjectURL(file); img.onload=function(){ URL.revokeObjectURL(url); var max=1100,w=img.width,h=img.height; if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>max){w=Math.round(w*max/h);h=max;} var c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.6)); }; img.onerror=function(){ cb(null); }; img.src=url; }
function go(view){
  if(view==='manage' && (!ME || !ME.isAdmin)) view='dashboard';
  VIEW = view;
  [].forEach.call($('nav').querySelectorAll('button[data-view]'), function(b){ b.setAttribute('aria-current', b.getAttribute('data-view')===view ? 'true':'false'); });
  $('main').classList.toggle('full', view==='dashboard');
  if(view==='dashboard') $('main').removeAttribute('data-sec'); else $('main').setAttribute('data-sec', view);
  /* Dashboard sections live in the submenu; highlight one only while on the dashboard */
  var sub=$('dashSub');
  if(sub){ [].forEach.call(sub.children, function(x){ x.setAttribute('aria-current', (view==='dashboard' && x.getAttribute('data-dash')===DASH_SECTION) ? 'true':'false'); }); }
  ({dashboard:viewDashboard, overview:viewOverview, readings:viewReadings, workorders:viewWorkorders, invoices:viewInvoices, manage:viewManage}[view] || viewDashboard)();
}
function viewDashboard(){ $('main').innerHTML = '<iframe id="dashFrame" title="Caribbean Paradise Homes Dashboard" src="/property-console#'+DASH_SECTION+'" style="display:block;width:100%;height:100vh;border:0;background:#f3efe9"></iframe>'; }

/* ---- OVERVIEW ---- */
async function viewOverview(){
  var m=$('main'); m.innerHTML='<div class="head"><div class="eyebrow">Caribbean Paradise Homes</div><h1>Where things stand</h1><div class="sub">Estate operations · '+VILLAS.length+' villas</div></div><div class="stats" id="ovStats"></div><div class="card"><h2 style="margin:0 0 4px;font-size:19px">Open work orders</h2><div id="ovWo"></div></div><div class="card"><h2 style="margin:0 0 4px;font-size:19px">Recent meter readings</h2><div id="ovRd"></div></div>';
  var r = await api('/api/readings'); var w = await api('/api/workorders');
  var reads=r.body.readings||[]; var wos=w.body.workorders||[]; var open=wos.filter(function(x){return x.status!=='Done';});
  $('ovStats').innerHTML =

    reading:{ t:'New meter reading', s:'Logged straight to Meter readings', html:

     +'<div class="row" style="margin-top:12px"><div>'+vsel('qVilla')+'</div><div><label>Login code</label><input id="qCode" placeholder="e.g. CDC-OWN-0012"/></div></div>' }
  }[kind];

    else if(kind==='villa'){ ep='/api/properties'; p={name:$('qName').value.trim(), meta:$('qMeta').value.trim()};

    else { ep='/api/owners'; p={name:$('qName').value.trim(), lastName:$('qLast').value.trim(), villa:$('qVilla').value, code:$('qCode').value.trim()};
      if(!p.name||!p.code){ msg.textContent='Name and login code are required.'; msg.className='msg err'; return; } }
    $('qSave').disabled=true; var r=await api(ep,{method:'POST',body:JSON.stringify(p)}); $('qSave').disabled=false;
    if(r.status===200){
      msg.textContent='Saved.'; msg.className='msg ok'; updateBadges();
      if(kind==='villa'||kind==='owner'){ var pr=await api('/api/properties'); VILLAS=(pr.body.properties||[]).filter(function(x){return x.active!==false;}).map(function(x){return x.name;}); }
      setTimeout(function(){ qaClose();
        var dest={invoice:'invoices',workorder:'workorders',reading:'readings',villa:'manage',owner:'manage'}[kind];
        go(dest);
      }, 500);
    } else { msg.textContent=(r.body&&r.body.error)||'Could not save.'; msg.className='msg err'; }
  };
}

    +(rows.length?'':'<tr><td colspan="5" class="empty">No owners yet.</td></tr>')
    +rows.map(function(o){ return '<tr><td style="font-weight:500">'+esc(o.name)+'<div class="muted">'+esc(o.lang==='en'?'English':'Spanish')+'</div></td><td>'+esc(o.villa||'—')+'</td><td><code class="tag">'+esc(o.code||'')+'</code></td><td class="muted">'+esc(o.email||'')+'</td><td><button class="link" data-delo="'+esc(o.id)+'">Delete</button></td></tr>'; }).join('')+'</tbody></table>';
  $('oList').querySelectorAll('[data-delo]').forEach(function(b){ b.onclick=async function(){ if(!confirm('Delete this owner?'))return; await api('/api/owners/delete',{method:'POST',body:JSON.stringify({id:b.getAttribute('data-delo')})}); loadOwners(); }; });
}

/* ---- login handlers ---- */
$('loginBtn').onclick = async function(){
  var msg=$('loginMsg'); msg.textContent=''; msg.className='msg';
  var name=$('loginName').value, code=$('loginCode').value;
  if(!name||!code){ msg.textContent='Choose your name and enter your code.'; msg.className='msg err'; return; }
  $('loginBtn').disabled=true; var r=await api('/api/login',{method:'POST',body:JSON.stringify({name:name,code:code})}); $('loginBtn').disabled=false;
  if(r.status===200){ $('loginCode').value=''; boot(); } else { msg.textContent=(r.body&&r.body.error)||'Sign-in failed.'; msg.className='msg err'; }
};
$('loginCode').addEventListener('keydown',function(e){ if(e.key==='Enter') $('loginBtn').click(); });
$('logout').onclick = async function(){ await api('/api/logout',{method:'POST'}); ME=null; document.body.classList.add('login-mode'); };
$('quickAddBtn').onclick = qaOpen;
$('qaClose').onclick = qaClose;
$('qaWrap').addEventListener('mousedown', function(e){ if(e.target===this) qaClose(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') qaClose(); });

boot();
(function(){ var v0=null; function chk(){ fetch('/api/version',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){ if(v0===null){v0=d.v;} else if(d.v&&d.v!==v0){ $('cphUpdateBar').style.display='block'; } }).catch(function(){}); } chk(); setInterval(chk,60000); })();
</script>
</body>
</html>
